name: Build add-on

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ["aarch64", "amd64", "armv7", "i386"]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.arch }}
        run: >
          docker run --rm --privileged -v "${{ github.workspace }}:/data" --
          ghcr.io/home-assistant/builder:latest
          --${{ matrix.arch }}
          --target /addon
          --image "ghcr.io/voidelle/{arch}-zigbee-mesh-health"
          --version "$(grep -m1 '^version:' addon/config.yaml | cut -d'"' -f2)"
