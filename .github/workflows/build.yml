name: Build add-on images

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # baseline aarch64+qemu ≈ 21min; without this a hung job blocks for 6h (GitHub default)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for image tags
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Read version from addon config
        id: ver
        run: |
          VERSION=$(sed -nE 's/^version: *"([^"]+)".*/\1/p' addon/config.yaml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.arch }}-zigbee-mesh-health:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.arch }}-zigbee-mesh-health:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
